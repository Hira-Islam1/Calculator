<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <h3 >Calculator</h3>
    <p class="showDisplay"></p>
<div id="calculator">

    <button class="addbtns">7</button>
    <button class="addbtns">8</button>
    <button class="addbtns">9</button>
    <button class="addbtns right-op">/</button>
    <button class="addbtns">4</button>
    <button class="addbtns">5</button>
    <button class="addbtns">6</button>
    <button class="addbtns right-op">*</button>
    <button class="addbtns">1</button>
    <button class="addbtns">2</button>
    <button class="addbtns">3</button>
    <button class="addbtns  right-op ">-</button>
    <button class="addbtns grayclr">C</button>
    <button class="addbtns grayclr">0</button>
    <button class="addbtns grayclr">+</button>
    <button class="addbtns right-op">=</button>
    <button class=" addbtns badge">del</button>

<script src="app.js"></script>
    
</body>

</html>
